<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aman's Cinema | Movie Experience</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', 'Segoe UI', sans-serif; }

    :root {
        --bg:#0a0a0f;
        --surface:rgda(20, 20, 28, 0.75);
        --surface-solid:#14141c;
        --border:rgba(255, 255, 255, 0.1);
        --text:#f1f1f5;
        --muted:#b8b8c8;
        --gold:#f5b942;
        --red:#e50914;
    }

    /* ============================================
       CINEMA
       ============================================ */
    body {
        background-color: #008;
        color: var(--text);
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
    }

    /* Fixed cinema background image */
    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1920&q=80');
        /* ↑ Yeh Unsplash ki free cinema hall image hai */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: -2;
        filter: brightness(0.4) saturate(0.9);
        /* ↑ Image ko dark karta hai taaki text clear dikhe */
    }

    /* Dark gradient overlay */
    body::after {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: 
            radial-gradient(ellipse at center, rgba(229, 9, 20, 0.15) 0%, transparent 60%),
            linear-gradient(180deg, rgba(10, 10, 15, 0.7) 0%, rgba(10, 10, 15, 0.95) 100%);
        z-index: -1;
        pointer-events: none;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
        position: relative;
        z-index: 1;
    }

    /* ============================================
       HEADER - Glass effect
       ============================================ */
    header {
        padding: 20px 28px;
        background: var(--surface);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 16px;
        margin-bottom: 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .logo {
        font-size: 1.3rem;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .logo-icon {
        width: 49px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--red), var(--gold));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }

    .logo-text {
        background: linear-gradient(135deg, var(--red), var(--gold));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .header-right {
        display: flex;
        gap: 12px;
        align-items: center;
    }

    .stat-badge {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        padding: 6px 14px;
        border-radius: 50px;
        font-size: 0.8rem;
        color: var(--muted);
    }

    /* ============================================
       HERO - Big cinematic title
       ============================================ */
    .hero {
        text-align: center;
        padding: 50px 20px 60px;
    }

    .hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 18px;
        border-radius: 50px;
        background: rgba(229, 9, 20, 0.15);
        border: 1px solid rgba(229, 9, 20, 0.4);
        font-size: 0.75rem;
        color: #ff5c5c;
        font-weight: 700;
        letter-spacing: 0.1em;
        margin-bottom: 20px;
        text-transform: uppercase;
        backdrop-filter: blur(10px);
    }

    .hero h1 {
        font-size: clamp(2rem, 6vw, 4rem);
        font-weight: 900;
        line-height: 1.05;
        margin-bottom: 18px;
        letter-spacing: -0.02em;
        text-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
    }

    .hero h1 span {
        background: linear-gradient(135deg, var(--red), var(--gold));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 30px rgba(245, 185, 66, 0.4));
    }

    .hero p {
        color: var(--muted);
        max-width: 600px;
        margin: 0 auto;
        font-size: 1.05rem;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    /* ============================================
       SEARCH BOX - Glass effect
       ============================================ */
    .search-box {
        position: relative;
        margin-bottom: 40px;
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
    }

    .search-box input {
        width: 100%;
        padding: 18px 24px 18px 56px;
        border-radius: 14px;
        background: rgba(20, 20, 28, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 1rem;
        outline: none;
        transition: all 0.3s;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .search-box input:focus {
        border-color: var(--red);
        box-shadow: 0 8px 32px rgba(229, 9, 20, 0.3);
    }

    .search-box input::placeholder {
        color: var(--muted);
    }

    .search-box::before {
        content: '🔍';
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1.2rem;
        opacity: 0.7;
        z-index: 2;
    }

    /* ============================================
       FILMS GRID
       ============================================ */
    .films-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 24px;
        margin-bottom: 60px;
    }

    .film-card {
        background: rgba(20, 20, 28, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        transition: all 0.35s ease;
        position: relative;
        display: flex;
        flex-direction: column;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .film-card:hover {
        transform: translateY(-8px);
        border-color: rgba(245, 185, 66, 0.5);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(229, 9, 20, 0.2);
    }

    .film-poster {
        width: 100%;
        aspect-ratio: 2 / 3;
        background-color: #1a1a24;
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        opacity: 0.95;
        position: relative;
    }

    .film-poster::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(20, 20, 28, 0.9) 0%, transparent 40%);
    }

    .film-info {
        padding: 18px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }

    .film-title {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 6px;
        line-height: 1.3;
    }

    .film-meta {
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 8px;
    }

    /* ============================================
       STATES (loading, empty)
       ============================================ */
    .loading-state, .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: var(--muted);
        grid-column: 1 / -1;
        background: rgba(20, 20, 28, 0.6);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .empty-icon {
        font-size: 3.5rem;
        margin-bottom: 16px;
        opacity: 0.6;
    }

    .empty-state h3 {
        font-size: 1.3rem;
        margin-bottom: 8px;
        color: var(--text);
    }

    /* ============================================
       FOOTER
       ============================================ */
    footer {
        text-align: center;
        padding: 30px 0;
        color: var(--muted);
        font-size: 0.85rem;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    footer span {
        background: linear-gradient(135deg, var(--red), var(--gold));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-weight: 700;
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 640px) {
        .container { padding: 16px; }
        header { padding: 16px 20px; }
        .logo { font-size: 1.1rem; }
        .logo-icon { width: 36px; height: 36px; }
        .films-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
        .film-info { padding: 14px; }
        .film-title { font-size: 0.95rem; }
    }
</style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <header>
        <div class="logo">
            <div class="logo-icon">🎬</div>
            <div class="logo-text">Aman's Cinema</div>
        </div>
        <div class="header-right">
            <div class="stat-badge">🎞️ Powered by TMDB</div>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-badge">🍿 Now Showing</div>
        <h1>Find Your Next <span>Favorite Film</span></h1>
        <p>Search any movie and discover its poster, rating, and details — right from the comfort of your cinema seat.</p>
    </section>

    <!-- SEARCH -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search for a movie... (e.g., Inception, Interstellar)">
    </div>

    <!-- FILMS GRID -->
    <div class="films-grid" id="filmsGrid">
        <div class="loading-state">Type a movie name to start exploring... 🍿</div>
    </div>

    <!-- FOOTER -->
    <footer>
        Made with ❤️ by <span>Aman Mirza</span> • © 2024
    </footer>
</div>

<script>
    // ============================================================
    // YAHAN APNI TMDB API KEY PASTE KARO
    // ============================================================
    const TMDB_API_KEY = 'YOUR_TMDB_API_KEY_HERE';
    // ============================================================

    const searchInput = document.getElementById('searchInput');
    const filmsGrid = document.getElementById('filmsGrid');
    const IMG_BASE_URL = 'https://image.tmdb.org/t/p/w500';

    let debounceTimer;

    searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        const query = searchInput.value.trim();
        if (query.length === 0) {
            filmsGrid.innerHTML = '<div class="loading-state">Type a movie name to start exploring... 🍿</div>';
            return;
        }
        debounceTimer = setTimeout(() => searchMovies(query), 500);
    });

    async function searchMovies(query) {
        filmsGrid.innerHTML = '<div class="loading-state">Searching... 🔍</div>';

        if (TMDB_API_KEY === 'YOUR_TMDB_API_KEY_HERE') {
            filmsGrid.innerHTML = '<div class="empty-state"><div class="empty-icon">🔑</div><h3>API Key Missing!</h3><p>Please paste your TMDB API key in the code.</p></div>';
            return;
        }

        const url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&include_adult=false&language=en-US&page=1`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Network error');
            const data = await response.json();
            displayMovies(data.results);
        } catch (error) {
            console.error(error);
            filmsGrid.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Oops! Something went wrong.</h3><p>Please try again later.</p></div>';
        }
    }

    function displayMovies(movies) {
        if (!movies || movies.length === 0) {
            filmsGrid.innerHTML = '<div class="empty-state"><div class="empty-icon">🎞️</div><h3>No movies found</h3><p>Try a different title.</p></div>';
            return;
        }

        filmsGrid.innerHTML = '';

        movies.forEach(movie => {
            const posterUrl = movie.poster_path
                ? `${IMG_BASE_URL}${movie.poster_path}`
                : null;

            const card = document.createElement('div');
            card.className = 'film-card';

            const posterStyle = posterUrl ? `background-image: url('${posterUrl}');` : '';
            const posterContent = posterUrl ? '' : '🎬';

            card.innerHTML = `
                <div class="film-poster" style="${posterStyle}">${posterContent}</div>
                <div class="film-info">
                    <div class="film-title">${movie.title}</div>
                    <div class="film-meta">
                        ${movie.release_date ? movie.release_date.substring(0, 4) : 'N/A'} • ⭐ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}
                    </div>
                </div>
            `;
            filmsGrid.appendChild(card);
        });
    }
</script>
</body>
</html>
