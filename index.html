<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aman Mirza | Films Collection</title>
    <style>
        /* --- Reset & Base --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        :root {
            --bg: #0a0a0f;
            --surface: #14141c;
            --surface-2: #1a1a24;
            --border: #26263a;
            --text: #f1f1f5;
            --muted: #8b8ba7;
            --gold: #f5b942;
            --red: #e50914;
            --accent: #7c5cff;
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Background Cinematic Glow --- */
        body::before {
            content: '';
            position: fixed;
            top: -300px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 900px;
            background: radial-gradient(circle, rgba(229, 9, 20, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -300px;
            right: -200px;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(245, 185, 66, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* --- Header --- */
        header {
            padding: 32px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            margin-bottom: 50px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--red), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .logo-text {
            background: linear-gradient(135deg, var(--red), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--text); }

        /* --- Hero Section --- */
        .hero {
            text-align: center;
            padding: 40px 0 60px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 50px;
            background: rgba(229, 9, 20, 0.1);
            border: 1px solid rgba(229, 9, 20, 0.3);
            font-size: 0.8rem;
            color: var(--red);
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }

        .hero h1 span {
            background: linear-gradient(135deg, var(--red), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            color: var(--muted);
            max-width: 600px;
            margin: 0 auto;
            font-size: 1.05rem;
        }

        /* --- Add Film Form --- */
        .add-film-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 50px;
            position: relative;
            overflow: hidden;
        }

        .add-film-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--red), var(--gold));
        }

        .form-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-group input,
        .input-group select {
            padding: 12px 16px;
            border-radius: 10px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.1);
        }

        .input-group input::placeholder {
            color: #55556a;
        }

        .add-btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--red), var(--gold));
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.02em;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.3);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        /* --- Films List --- */
        .films-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .films-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .film-count {
            font-size: 0.85rem;
            color: var(--muted);
            background: var(--surface);
            padding: 6px 14px;
            border-radius: 50px;
            border: 1px solid var(--border);
        }

        .films-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }

        .film-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .film-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, var(--red), var(--gold));
        }

        .film-card:hover {
            transform: translateY(-5px);
            border-color: rgba(229, 9, 20, 0.4);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .film-delete {
            position: absolute;
            top: 12px;
            right: 12px;
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            line-height: 1;
        }

        .film-delete:hover {
            color: var(--red);
            background: rgba(229, 9, 20, 0.1);
        }

        .film-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 16px;
            padding-right: 30px;
            line-height: 1.3;
        }

        .film-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .info-label {
            color: var(--muted);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            min-width: 80px;
        }

        .info-value {
            color: var(--text);
            font-weight: 500;
        }

        .lang-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            background: rgba(124, 92, 255, 0.15);
            border: 1px solid rgba(124, 92, 255, 0.3);
            color: #a78bfa;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .cinema-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            background: rgba(245, 185, 66, 0.15);
            border: 1px solid rgba(245, 185, 66, 0.3);
            color: var(--gold);
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* --- Empty State --- */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
            grid-column: 1 / -1;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--text);
        }

        /* --- Footer --- */
        footer {
            padding: 40px 0;
            text-align: center;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.85rem;
        }

        footer span {
            background: linear-gradient(135deg, var(--red), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        /* --- Responsive --- */
        @media (max-width: 640px) {
            .form-grid { grid-template-columns: 1fr; }
            .films-grid { grid-template-columns: 1fr; }
            .add-film-section { padding: 24px; }
            header { padding: 20px 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="logo">
                <div class="logo-icon">🎬</div>
                <div class="logo-text">Aman's Cinema</div>
            </div>
            <a href="https://amanmirza.github.io" class="back-link">← Back to Home</a>
        </header>

        <!-- HERO -->
        <section class="hero">
            <div class="hero-badge">🎥 My Film Diary</div>
            <h1>Films I've <span>Watched</span></h1>
            <p>Add your favorite movies with their language and where you watched them — cinema, OTT, or home.</p>
        </section>

        <!-- ADD FILM FORM -->
        <section class="add-film-section">
            <div class="form-title">➕ Add a New Film</div>
            <form id="filmForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Film Name</label>
                        <input type="text" id="filmName" placeholder="e.g. Interstellar" required>
                    </div>
                    <div class="input-group">
                        <label>Language</label>
                        <input type="text" id="filmLang" placeholder="e.g. English / Hindi" required>
                    </div>
                    <div class="input-group">
                        <label>Cinema / Platform</label>
                        <input type="text" id="filmCinema" placeholder="e.g. PVR / Netflix" required>
                    </div>
                </div>
                <button type="submit" class="add-btn">Add Film 🎬</button>
            </form>
        </section>

        <!-- FILMS LIST -->
        <div class="films-header">
            <h2>📽️ My Collection</h2>
            <div class="film-count" id="filmCount">0 Films</div>
        </div>

        <div class="films-grid" id="filmsGrid">
            <!-- Films will be added here -->
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>Made with ❤️ by <span>Aman Mirza</span> • © 2024</p>
        </div>
    </footer>

    <script>
        // --- Load films from localStorage ---
        let films = JSON.parse(localStorage.getItem('amanFilms')) || [];

        const form = document.getElementById('filmForm');
        const grid = document.getElementById('filmsGrid');
        const countEl = document.getElementById('filmCount');

        // --- Render all films ---
        function renderFilms() {
            grid.innerHTML = '';

            if (films.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎞️</div>
                        <h3>No films added yet</h3>
                        <p>Start by adding your first movie above!</p>
                    </div>
                `;
                countEl.textContent = '0 Films';
                return;
            }

            films.forEach((film, index) => {
                const card = document.createElement('div');
                card.className = 'film-card';
                card.innerHTML = `
                    <button class="film-delete" onclick="deleteFilm(${index})" title="Delete">✕</button>
                    <div class="film-title">${escapeHtml(film.name)}</div>
                    <div class="film-info">
                        <div class="info-row">
                            <span class="info-label">Language</span>
                            <span class="lang-badge">${escapeHtml(film.language)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Watched at</span>
                            <span class="cinema-badge">${escapeHtml(film.cinema)}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            countEl.textContent = films.length + (films.length === 1 ? ' Film' : ' Films');
        }

        // --- Add a new film ---
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('filmName').value.trim();
            const language = document.getElementById('filmLang').value.trim();
            const cinema = document.getElementById('filmCinema').value.trim();

            if (!name || !language || !cinema) return;

            films.unshift({ name, language, cinema });
            localStorage.setItem('amanFilms', JSON.stringify(films));

            form.reset();
            renderFilms();

            // Smooth scroll to collection
            grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        // --- Delete a film ---
        function deleteFilm(index) {
            if (confirm('Delete this film entry?')) {
                films.splice(index, 1);
                localStorage.setItem('amanFilms', JSON.stringify(films));
                renderFilms();
            }
        }

        // --- Escape HTML to prevent issues ---
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // --- Initial render ---
        renderFilms();
    </script>

</body>
</html>
