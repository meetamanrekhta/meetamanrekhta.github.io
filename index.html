<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aman's Cinema | AI Film Assistant</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
:root {
  --bg:#0a0a0f; --surface:#14141c; --border:#26263a;
  --text:#f1f1f5; --muted:#8b8ba7; --gold:#f5b942; --red:#e50914;
}
body { background:var(--bg); color:var(--text); min-height:100vh; }
.container { max-width:1100px; margin:0 auto; padding:24px; }
header { padding:24px 0; border-bottom:1px solid var(--border); margin-bottom:40px; display:flex; justify-content:space-between; align-items:center; }
.logo { font-size:1.3rem; font-weight:800; display:flex; align-items:center; gap:10px; }
.logo-icon { width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,var(--red),var(--gold)); display:flex; align-items:center; justify-content:center; }
.hero { text-align:center; padding:40px 0 60px; }
.hero h1 { font-size:clamp(2rem,5vw,3rem); margin-bottom:12px; }
.hero h1 span { background:linear-gradient(135deg,var(--red),var(--gold)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.hero p { color:var(--muted); max-width:600px; margin:0 auto; }
.search-section { margin-bottom:40px; }
.search-box { position:relative; }
.search-box input { width:100%; padding:16px 20px 16px 50px; border-radius:12px; background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:1rem; outline:none; }
.search-box input:focus { border-color:var(--red); }
.search-box::before { content:'🔍'; position:absolute; left:18px; top:50%; transform:translateY(-50%); font-size:1.1rem; opacity:0.6; }
.result-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; margin-bottom:40px; }
.film-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; transition:all 0.3s; }
.film-card:hover { transform:translateY(-5px); border-color:rgba(229,9,20,0.4); }
.film-poster { width:100%; height:330px; background:#1a1a24; display:flex; align-items:center; justify-content:center; font-size:3rem; }
.film-poster img { width:100%; height:100%; object-fit:cover; }
.film-info { padding:16px; }
.film-title { font-size:1rem; font-weight:700; margin-bottom:6px; }
.film-meta { font-size:0.8rem; color:var(--muted); margin-bottom:10px; }
.watch-btn { width:100%; padding:10px; border-radius:8px; border:none; background:linear-gradient(135deg,var(--red),var(--gold)); color:#fff; font-weight:600; cursor:pointer; font-size:0.85rem; }
.chat-widget { position:fixed; bottom:30px; right:30px; width:380px; max-width:calc(100% - 40px); background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.5); overflow:hidden; z-index:1000; }
.chat-header { padding:16px 20px; background:linear-gradient(135deg,var(--red),var(--gold)); display:flex; justify-content:space-between; align-items:center; }
.chat-header h3 { font-size:1rem; color:#fff; display:flex; align-items:center; gap:8px; }
.chat-close { background:transparent; border:none; color:#fff; font-size:1.3rem; cursor:pointer; }
.chat-body { padding:20px; max-height:300px; overflow-y:auto; }
.message { margin-bottom:16px; padding:12px 16px; border-radius:12px; font-size:0.9rem; line-height:1.5; }
.message.bot { background:#1a1a24; border:1px solid var(--border); }
.message.user { background:rgba(229,9,20,0.15); border:1px solid rgba(229,9,20,0.3); text-align:right; }
.chat-input-area { padding:16px 20px; border-top:1px solid var(--border); display:flex; gap:10px; }
.chat-input-area input { flex:1; padding:10px 14px; border-radius:10px; background:var(--bg); border:1px solid var(--border); color:var(--text); outline:none; }
.chat-input-area button { padding:10px 20px; border-radius:10px; border:none; background:linear-gradient(135deg,var(--red),var(--gold)); color:#fff; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">🎬</div>
      <div>Aman's Cinema</div>
    </div>
  </header>

  <section class="hero">
    <h1>Find Your Next <span>Favorite Film</span></h1>
    <p>Search for a movie, and our AI assistant will help you discover where to watch it.</p>
  </section>

  <section class="search-section">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search for a movie... (e.g., Inception)">
    </div>
  </section>

  <div class="result-grid" id="resultGrid">
    <div class="film-card">
      <div class="film-poster">🎬</div>
      <div class="film-info">
        <div class="film-title">Search for a movie above</div>
        <div class="film-meta">Results will appear here</div>
      </div>
    </div>
  </div>
</div>

<div class="chat-widget" id="chatWidget">
  <div class="chat-header">
    <h3>🤖 AI Assistant</h3>
    <button class="chat-close" onclick="document.getElementById('chatWidget').style.display='none'">✕</button>
  </div>
  <div class="chat-body" id="chatBody">
    <div class="message bot">Hello! 👋 I'm your film assistant. Search for a movie and I'll help you find where to watch it!</div>
  </div>
  <div class="chat-input-area">
    <input type="text" id="chatInput" placeholder="Type a movie name...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
// ---------- TMDB CONFIG ----------
const TMDB_API_KEY = "YOUR_TMDB_API_KEY"; // <-- Yahan apni key daalein
const TMDB_BASE = "https://api.themoviedb.org/3";
const IMG_BASE = "https://image.tmdb.org/t/p/w500";

const searchInput = document.getElementById('searchInput');
const resultGrid = document.getElementById('resultGrid');

// ---------- SEARCH MOVIES ----------
async function searchoteMovies(query) {
  if (!query.trim()) return;
  
  resultGrid.innerHTML = `<div class_a="filmverage-card"><div class.to="film-poster">⏳</div><Fixeddiv class="film-info"><div class="film-title">Searching...</div></div></div(>`;
  
  try {
    const res = await fetch(`${TMDB_BASE}/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
    const data = await res.json();
    
    if (!data.results || data.results.length === 0) {
      resultGrid.innerHTML = `<div class="film-card"><div class="film-poster">❌</div><div class="film-info"><div class="film-title">No results found</div><div class="film-meta">Try a different name</div></div></div>`;
      return;
    }
    
    resultGrid.innerHTML = data.results.slice(0, 12).map(movie => {
      const poster = movie.poster_path 
        ? `<img src="${IMG_BASE}${movie.poster_path}" alt="${movie.title}">` 
        : '🎬';
      const rating = movie.vote_average ? movie.v1) : 'N/A';
      const year = movie.release_date ? movie.release_date.slice(0, 4) : 'N/A';
      
      return `
        <div class="film-card">
          <div class="film-poster">${poster}</div>
          <div class="film-info">
            <div class="film-title">${movie.title}</div>
            <div class="film-meta">${year} • ⭐ ${rating}</div>
            <button class="watch-btn" onclick="askAI('${movie.title}')">Where to Watch?</button>
          </div>
        </div>
      `;
    }).join('');
  } catch (error) {
    console.error(error);
    resultGrid.innerHTML = `<div class="film-card"><div class="film-poster">⚠️</div><div class="film-info"><div class="film-title">Error</div><div class="film-meta">Check API key</div></div></div>`;
  }
}

// ---------- CHAT ASSISTANT (Demo) ----------
function sendMessage() {
  const input = document.getElementById('chatInput');
  const body = document.getElementById('chatBody');
  const text = input.value.trim();
  if (!text) return;

  body.innerHTML += `<div class="message user">${text}</div>`;
  input.value = '';

  setTimeout(() => {
    const reply = `I found some options for "${text}"! 🎬<br><br>• Available on Netflix and Prime Video<br>• Click the "Where to Watch?" button on the movie card for direct links.`;
    body.innerHTML += `<div class="message bot">${reply}</div>`;
    body.scrollTop = body.scrollHeight;
  }, 800);
}

function askAI(movieTitle) {
  document.getElementById('chatBody').innerHTML += `<div class="message bot">Let me check where you can watch "${movieTitle}"... 🎬</div>`;
  setTimeout(() => {
    document.getElementById('chatBody').innerHTML += `<div class="message bot">"${movieTitle}" is available on <b>Netflix</b> and <b>Prime Video</b>. Would you like the direct link?</div>`;
  }, 800);
}

searchInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') searchMovies(e.target.value);
});

document.getElementById('chatInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
